<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo Placement Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/premium.css" />
  </head>
  <body class="ambient-backdrop">
    <main class="mx-auto w-full max-w-6xl px-4 pb-10 pt-6 md:px-8">
      <header class="topbar-shell glass-panel mb-8 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="brand-logo-chip brand-logo-chip-sm">
            <img src="/brand-logo.png" alt="Law Office Pro Logo" class="brand-logo-img" />
          </div>
          <span class="text-sm font-bold">نظام إدارة مكتب المحاماة</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="mini-chip rounded-full bg-white/10 px-3 py-1 text-xs font-semibold">Preview</span>
        </div>
      </header>

      <section class="grid grid-cols-1 items-center gap-8 lg:grid-cols-2">
        <div class="login-glow relative">
          <div class="glass-panel rounded-3xl p-6 text-center">
            <h1 class="text-2xl font-black text-white">Law Office Pro</h1>
            <p class="mt-2 text-sm font-medium text-slate-300">Premium legal-tech identity</p>
          </div>
        </div>

        <div class="mx-auto w-full max-w-md">
          <div class="glass-panel card-base rounded-3xl p-7 md:p-8">
            <div class="mb-6 text-center">
              <div class="mx-auto mb-4 h-24 w-24 overflow-hidden rounded-2xl border border-white/15 bg-white/5">
                <div class="logo-static-wrap">
                  <img src="/brand-logo.png" alt="Law Office Pro Logo" class="logo-static-img login-card-logo" />
                </div>
              </div>
              <h2 class="text-2xl font-extrabold text-white">تسجيل الدخول</h2>
              <p class="mt-2 text-sm font-medium text-slate-300">بوابة الوصول الآمن إلى نظام إدارة المكتب</p>
            </div>
            <form class="space-y-4">
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">اسم المستخدم</label>
                <input class="input-base" placeholder="username" />
              </div>
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">كلمة المرور</label>
                <input class="input-base" type="password" placeholder="••••••••" />
              </div>
              <button class="btn-primary mt-2 w-full px-4 py-2 text-sm font-semibold" type="button">دخول إلى المنصة</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
